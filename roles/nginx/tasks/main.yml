---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Start and enable Nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Allow HTTP traffic through UFW
  ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: ansible_facts.services is defined