- name: Configure VPS
  hosts: aws
  become: true
  vars_files:
    - group_vars/aws/vars.yml
  vars:
    nvm_version: "0.40.3"

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Install nvm prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - git
          - build-essential
        state: present

    - name: Download nvm install script
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh"
        dest: /tmp/nvm-install.sh
        mode: "0755"
      become: false

    - name: Install nvm (skipped if already installed)
      ansible.builtin.command:
        cmd: bash /tmp/nvm-install.sh
        creates: "~/.nvm/nvm.sh"
      become: false

    - name: Verify nvm
      ansible.builtin.shell:
        cmd: ". ~/.nvm/nvm.sh && nvm --version"
        executable: /bin/bash
      become: false
      register: nvm_check
      changed_when: false

    - name: Show nvm version
      ansible.builtin.debug:
        msg: "nvm version: {{ nvm_check.stdout }}"

    - name: Create a file 
      file: 
        path: /home/ubuntu/file.txt
        state: touch
        mode: '0644'
      tags: create_file  